<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found</title>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --muted: #666666;
      --border: #e5e5e5;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: left;
      max-width: 520px;
      padding: 32px;
      border: 1px solid var(--border);
    }

    .code {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 14px;
      font-size: 13px;
      border: 1px solid var(--fg);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }

    .btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="code">404</div>
    <div class="title">Page not found</div>
    <div class="desc">
      The page you’re looking for doesn’t exist or has been moved.
      Please check the URL or return to a safe location.
    </div>

    <div class="actions">
      <button class="btn" onclick="history.back()">Go back</button>
      <button class="btn" onclick="location.href='/index.html'">Home</button>
    </div>

    <footer>
      System error · HTTP 404
    </footer>
  </div>
</body>
</html>
